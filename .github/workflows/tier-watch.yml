name: Sorare tier watch

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 6h-7h heure de Paris
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier les tiers
        id: watch
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
        run: python tier_watch.py

      - name: Sauvegarder l'état et le tableau de bord
        run: |
          git config user.name "tier-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Tiers du $(date +%F)"
          git push

      - name: Ouvrir une issue (= e-mail) s'il y a des changements
        if: ${{ steps.watch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ steps.watch.outputs.title }}" --body-file report.md
