name: Sorare tier watch

on:
  schedule:
    - cron: "17 7 * * *"   # tous les jours vers 8h-9h heure de Paris
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Une seule exécution à la fois : si tu en relances une, elle attend la précédente
concurrency:
  group: tier-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vérifier les tiers
        id: watch
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
        run: python tier_watch.py

      - name: Sauvegarder l'état et le tableau de bord
        run: |
          git config user.name "tier-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet && exit 0
          git commit -m "Tiers du $(date +%F)"
          # Si tu as modifié des fichiers sur GitHub pendant l'exécution,
          # on récupère tes changements avant d'envoyer les données.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Ouvrir une issue (= e-mail) s'il y a des changements
        if: ${{ steps.watch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "${{ steps.watch.outputs.title }}" --body-file report.md
